# LinHT platform layer (prototype, D28). Goes upstream to meta-linht-hardware and
# meta-linht-software with the RFC.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "linht-platform"
BBFILE_PATTERN_linht-platform = "^${LAYERDIR}/"
BBFILE_PRIORITY_linht-platform = "7"

# meta-customhardware is the collection name of meta-linht-hardware
LAYERDEPENDS_linht-platform = "core meta-customhardware meta-linht-software"
LAYERSERIES_COMPAT_linht-platform = "scarthgap"
