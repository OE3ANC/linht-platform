namespace: system.keypad
version: 1
title: Keypad
keys:
  backlight_brightness:
    type: int
    default: 255
    min: 0
    max: 255
    step: 32
    label: Key light
    description: Backlight level of the keypad. 0 turns it off.
    order: 1
  backlight_timeout:
    type: int
    default: 10
    choices: [0, 5, 10, 15, 30, 60]
    unit: s
    label: Key light off after
    description: Seconds without a key press before the keypad light turns off. 0 keeps it on.
    order: 2
