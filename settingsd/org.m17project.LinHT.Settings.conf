<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- Anyone may call; linht-settingsd checks write access per key by caller uid (docs/settings-schema.md). -->
<busconfig>
  <policy user="linht-settings">
    <allow own="org.m17project.LinHT.Settings"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.m17project.LinHT.Settings"/>
  </policy>
</busconfig>
