# SPDX-License-Identifier: GPL-3.0-only
# gui_test is the interim Radio app (D16). It reads /dev/input/linht-keys, which linht-shelld creates,
# and linht-shelld decides when it runs.
[Unit]
After=linht-shelld.service
# Without linht-shelld the key device is gone and gui_test would never see a PTT release. Stop it
# too, so its SIGTERM cleanup puts the radio back to receive.
BindsTo=linht-shelld.service
